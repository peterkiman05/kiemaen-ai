<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiemaen OS | Enterprise</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #0a0a0a; color: #00ffcc; margin: 0; display: flex; height: 100vh; align-items: center; justify-content: center; overflow: hidden; }
        .login-box { background: #111; padding: 40px; border: 1px solid #333; text-align: center; width: 90%; max-width: 350px; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); }
        .dashboard { display: none; width: 100%; height: 100%; flex-direction: row; }
        
        .sidebar { width: 250px; background: #111; padding: 20px; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar h2 { color: #fff; text-align: center; font-size: 18px; }
        .nav-btn { display: block; width: 100%; background: transparent; color: #aaa; border: 1px solid #333; padding: 15px; margin-bottom: 10px; cursor: pointer; text-align: left; transition: 0.2s; }
        .nav-btn:hover, .nav-btn.active { background: #00ffcc; color: #000; font-weight: bold; }
        
        .content { flex-grow: 1; padding: 20px; overflow-y: auto; }
        .panel { display: none; height: 100%; flex-direction: column; }
        .panel.active { display: flex; }
        
        input, select, textarea { width: 100%; box-sizing: border-box; background: #222; color: #00ffcc; border: 1px solid #555; padding: 12px; margin: 10px 0; font-family: inherit; }
        button { background: #00ffcc; color: #000; padding: 12px 20px; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        
        .chat-box { flex-grow: 1; background: #111; border: 1px solid #333; padding: 15px; overflow-y: auto; margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
        
        /* RESPONSIVE DESIGN FOR TABLETS & PHONES */
        @media (max-width: 768px) {
            .dashboard { flex-direction: column; }
            .sidebar { width: 100%; flex-direction: row; padding: 10px; border-right: none; border-bottom: 1px solid #333; overflow-x: auto; box-sizing: border-box; white-space: nowrap; }
            .sidebar h2 { display: none; }
            .nav-btn { width: auto; margin: 0 10px 0 0; flex: 0 0 auto; padding: 10px 15px; font-size: 14px; }
            .content { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- GATEKEEPER LOGIN -->
    <div id="login-screen" class="login-box">
        <h2>KIEMAEN OS</h2>
        <p style="color: #666; font-size: 12px;">Enterprise Auth Gateway</p>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="attemptLogin()">ENTER SYSTEM</button>
        <p id="error-msg" style="color: red; display: none; font-size: 12px; margin-top:10px;">Access Denied.</p>
    </div>

    <!-- ADMIN MASTER DASHBOARD -->
    <div id="admin-dashboard" class="dashboard">
        <div class="sidebar">
            <h2>JACOB // ADMIN</h2>
            <button class="nav-btn active" onclick="switchTab('kiemaen')">Kiemaen Classic</button>
            <button class="nav-btn" onclick="switchTab('kim')">Kim (Trading)</button>
            <button class="nav-btn" onclick="switchTab('kit')">Kit (B2B)</button>
            <button class="nav-btn" onclick="switchTab('kat')">Kat (VIP)</button>
        </div>
        
        <div class="content">
            <!-- Kiemaen Classic -->
            <div id="kiemaen" class="panel active">
                <h2 style="margin-top:0;">Original Kiemaen Engine</h2>
                <div class="chat-box" id="chat-log">System online. Connected to core.brain.</div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="chat-input" placeholder="Enter command..." onkeypress="if(event.key === 'Enter') sendChat()">
                    <button style="width: auto;" onclick="sendChat()">Send</button>
                </div>
            </div>

            <!-- Kim -->
            <div id="kim" class="panel">
                <h2 style="margin-top:0;">Kim Quantitative Override</h2>
                <input type="text" placeholder="Force Target Pair (e.g. XAUUSD)">
                <button>Override Algo</button>
            </div>

            <!-- Kit -->
            <div id="kit" class="panel">
                <h2 style="margin-top:0;">Kit Outbound Override</h2>
                <input type="text" placeholder="Assign Target Firm">
                <button>Deploy Campaign</button>
            </div>

            <!-- Kat -->
            <div id="kat" class="panel">
                <h2 style="margin-top:0;">Kat VIP Override</h2>
                <input type="text" placeholder="VIP Custom Instructions">
                <button>Inject Protocol</button>
            </div>
        </div>
    </div>

    <script>
        async function attemptLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const formData = new FormData();
            formData.append("username", user);
            formData.append("password", pass);

            try {
                const response = await fetch('/api/auth/login', { method: 'POST', body: formData });
                const result = await response.json();
                if (result.role === 'admin') {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('admin-dashboard').style.display = 'flex';
                } else {
                    document.getElementById('error-msg').style.display = 'block';
                }
            } catch (error) {
                // Fallback for local testing
                if (user === 'admin') { 
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('admin-dashboard').style.display = 'flex';
                }
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const log = document.getElementById('chat-log');
            const msg = input.value.trim();
            
            if(msg !== "") {
                log.innerHTML += `<br><br><b style="color:#fff">Jacob:</b> ${msg}`;
                input.value = "";
                log.scrollTop = log.scrollHeight;
                
                try {
                    const response = await fetch('/api/chat/kiemaen', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ message: msg })
                    });
                    const data = await response.json();
                    
                    let replyColor = data.status === 'error' ? 'red' : '#00ffcc';
                    log.innerHTML += `<br><b style="color:${replyColor}">Kiemaen:</b> ${data.response}`;
                } catch (err) {
                    log.innerHTML += `<br><b style="color:red">System Error:</b> Cannot reach cloud server.`;
                }
                log.scrollTop = log.scrollHeight;
            }
        }
    </script>
</body>
</html>
