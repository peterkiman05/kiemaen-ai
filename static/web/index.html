<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiemaen AGI</title>
    <style>
        /* CORE AESTHETIC BASED ON SCREENSHOTS */
        :root {
            --bg-dark: #0a0e17;
            --bg-panel: #161b28;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-blue: #3b82f6;
            --input-bg: #1e2536;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-dark); color: var(--text-primary); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* TOP NAVIGATION */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background-color: var(--bg-dark); border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10; }
        .menu-icon { font-size: 24px; cursor: pointer; color: #fff; user-select: none; }
        .header-title { font-size: 18px; font-weight: 500; letter-spacing: 0.5px; }
        .login-btn { background-color: rgba(255,255,255,0.1); color: #fff; border: none; padding: 6px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .login-btn:hover { background-color: rgba(255,255,255,0.2); }

        /* SIDEBAR (ENTERPRISE TOOLS) */
        .sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background-color: var(--bg-panel); box-shadow: 2px 0 10px rgba(0,0,0,0.5); transition: 0.3s; z-index: 100; display: flex; flex-direction: column; padding-top: 60px; }
        .sidebar.open { left: 0; }
        .close-sidebar { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: var(--text-secondary); }
        .nav-item { padding: 15px 25px; color: var(--text-primary); text-decoration: none; font-size: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .nav-item:hover, .nav-item.active { background-color: rgba(59, 130, 246, 0.1); color: var(--accent-blue); border-left: 4px solid var(--accent-blue); }

        /* MAIN CONTENT AREA */
        .main-container { flex-grow: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .panel { display: none; flex-direction: column; height: 100%; padding: 20px; overflow-y: auto; box-sizing: border-box; }
        .panel.active { display: flex; }

        /* KIEMAEN CLASSIC CHAT (DEFAULT) */
        #kiemaen-panel { padding: 0; position: relative; }
        
        .hero-center { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        .hero-center h1 { color: var(--accent-blue); font-size: 28px; font-weight: 600; margin-top: 15px; letter-spacing: -0.5px; }
        
        .chat-scroll { flex-grow: 1; padding: 20px; overflow-y: auto; padding-bottom: 90px; }
        .message { margin-bottom: 20px; max-width: 85%; line-height: 1.5; font-size: 15px; }
        .msg-user { margin-left: auto; background-color: var(--input-bg); padding: 12px 16px; border-radius: 18px 18px 0 18px; color: #fff; }
        .msg-ai { margin-right: auto; padding: 12px 0; color: #e5e7eb; }

        /* INPUT BAR */
        .input-wrapper { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px; box-sizing: border-box; background: linear-gradient(transparent, var(--bg-dark) 20%); }
        .input-bar { display: flex; align-items: center; background-color: var(--input-bg); border-radius: 30px; padding: 8px 15px; gap: 10px; }
        .icon-btn { background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; }
        .input-field { flex-grow: 1; background: transparent; border: none; color: #fff; font-size: 16px; outline: none; padding: 8px 0; }
        .input-field::placeholder { color: var(--text-secondary); }

        /* SVG FLOWER LOGO */
        .flower-logo { width: 80px; height: 80px; filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.4)); }
        .flower-btn { width: 28px; height: 28px; filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.6)); }

        /* ENTERPRISE PANELS (KIM, KIT, KAT) */
        .enterprise-input { width: 100%; background: var(--input-bg); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 15px; border-radius: 8px; margin-bottom: 15px; outline: none; }
        .enterprise-btn { width: 100%; background: var(--accent-blue); color: #fff; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* AUTH MODAL */
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; display: none; align-items: center; justify-content: center; }
        .auth-box { background: var(--bg-panel); padding: 30px; border-radius: 12px; width: 90%; max-width: 320px; text-align: center; }
    </style>
</head>
<body>

    <!-- SVG DEFS FOR FLOWER -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#60a5fa"/>
                <stop offset="100%" stop-color="#2563eb"/>
            </radialGradient>
            <g id="flower-shape">
                <path d="M50 50 C 40 20, 60 20, 50 50" fill="url(#blueGlow)" transform="rotate(0 50 50)"/>
                <path d="M50 50 C 40 20, 60 20, 50 50" fill="url(#blueGlow)" transform="rotate(72 50 50)"/>
                <path d="M50 50 C 40 20, 60 20, 50 50" fill="url(#blueGlow)" transform="rotate(144 50 50)"/>
                <path d="M50 50 C 40 20, 60 20, 50 50" fill="url(#blueGlow)" transform="rotate(216 50 50)"/>
                <path d="M50 50 C 40 20, 60 20, 50 50" fill="url(#blueGlow)" transform="rotate(288 50 50)"/>
                <circle cx="50" cy="50" r="5" fill="#0a0e17"/>
            </g>
        </defs>
    </svg>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="menu-icon" onclick="toggleMenu()">≡</div>
        <div class="header-title">Kiemaen AGI</div>
        <button class="login-btn" onclick="openAuth()">Login</button>
    </div>

    <!-- SIDEBAR NAVIGATION -->
    <div class="sidebar" id="sidebar">
        <div class="close-sidebar" onclick="toggleMenu()">×</div>
        <div class="nav-item active" onclick="switchPanel('kiemaen-panel', this)">Kiemaen Classic</div>
        <div class="nav-item" id="nav-kim" style="display:none;" onclick="switchPanel('kim-panel', this)">Kim (Trading)</div>
        <div class="nav-item" id="nav-kit" style="display:none;" onclick="switchPanel('kit-panel', this)">Kit (B2B)</div>
        <div class="nav-item" id="nav-kat" style="display:none;" onclick="switchPanel('kat-panel', this)">Kat (VIP)</div>
        <div class="nav-item" style="margin-top: auto; color: #ef4444;" onclick="location.reload()">Reset Session</div>
    </div>

    <!-- AUTH MODAL -->
    <div class="auth-overlay" id="auth-modal">
        <div class="auth-box">
            <h2 style="margin-top:0;">Authentication</h2>
            <input type="text" id="auth-user" class="enterprise-input" placeholder="Username">
            <input type="password" id="auth-pass" class="enterprise-input" placeholder="Password">
            <button class="enterprise-btn" onclick="attemptLogin()">Enter System</button>
            <p id="auth-msg" style="color:#ef4444; font-size:14px; display:none;"></p>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-container">
        
        <!-- 1. KIEMAEN CLASSIC (CHAT) -->
        <div id="kiemaen-panel" class="panel active">
            <div class="hero-center" id="hero-logo">
                <svg class="flower-logo" viewBox="0 0 100 100"><use href="#flower-shape"/></svg>
                <h1>Kiemaen AI</h1>
            </div>
            
            <div class="chat-scroll" id="chat-log"></div>
            
            <div class="input-wrapper">
                <div class="input-bar">
                    <button class="icon-btn">📎</button>
                    <input type="text" class="input-field" id="chat-input" placeholder="Message Kiemaen..." onkeypress="if(event.key === 'Enter') sendChat()">
                    <button class="icon-btn">🎤</button>
                    <button class="icon-btn" onclick="sendChat()">
                        <svg class="flower-btn" viewBox="0 0 100 100"><use href="#flower-shape"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. KIM (TRADING) -->
        <div id="kim-panel" class="panel">
            <h2>Kim (Quantitative Ops)</h2>
            <select class="enterprise-input"><option>Vault Markets - Main Fund</option><option>Paper Trading</option></select>
            <input type="text" class="enterprise-input" placeholder="Target Pair (e.g., XAUUSD)">
            <button class="enterprise-btn">Execute Algorithm</button>
        </div>

        <!-- 3. KIT (B2B) -->
        <div id="kit-panel" class="panel">
            <h2>Kit (Outbound Sales)</h2>
            <textarea class="enterprise-input" rows="4" placeholder="Assign target market or outreach parameters..."></textarea>
            <button class="enterprise-btn">Deploy Pipeline</button>
        </div>

        <!-- 4. KAT (VIP) -->
        <div id="kat-panel" class="panel">
            <h2>Kat (Client Relations)</h2>
            <textarea class="enterprise-input" rows="4" placeholder="Update Telegram VIP pricing or signal instructions..."></textarea>
            <button class="enterprise-btn">Inject Protocol</button>
        </div>

    </div>

    <script>
        // UI Navigation
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function switchPanel(panelId, element) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            element.classList.add('active');
            toggleMenu();
        }

        // Authentication Logic
        function openAuth() { document.getElementById('auth-modal').style.display = 'flex'; }
        
        async function attemptLogin() {
            const user = document.getElementById('auth-user').value;
            const pass = document.getElementById('auth-pass').value;
            const formData = new FormData();
            formData.append("username", user);
            formData.append("password", pass);

            try {
                const response = await fetch('/api/auth/login', { method: 'POST', body: formData });
                const result = await response.json();
                
                if (result.role === 'admin') {
                    // Unlock Enterprise Tabs
                    document.getElementById('nav-kim').style.display = 'block';
                    document.getElementById('nav-kit').style.display = 'block';
                    document.getElementById('nav-kat').style.display = 'block';
                    document.getElementById('auth-modal').style.display = 'none';
                    document.querySelector('.login-btn').innerText = 'Admin';
                } else {
                    document.getElementById('auth-msg').innerText = 'Access Denied';
                    document.getElementById('auth-msg').style.display = 'block';
                }
            } catch (error) {
                // Fallback for local testing
                if (user === 'admin') {
                    document.getElementById('nav-kim').style.display = 'block';
                    document.getElementById('nav-kit').style.display = 'block';
                    document.getElementById('nav-kat').style.display = 'block';
                    document.getElementById('auth-modal').style.display = 'none';
                    document.querySelector('.login-btn').innerText = 'Admin';
                }
            }
        }

        // Chat Logic (Original Brain Integration)
        async function sendChat() {
            const input = document.getElementById('chat-input');
            const log = document.getElementById('chat-log');
            const hero = document.getElementById('hero-logo');
            const msg = input.value.trim();
            
            if(msg !== "") {
                // Hide the center logo once chat begins
                if(hero) hero.style.display = 'none';
                
                log.innerHTML += `<div class="message msg-user">${msg}</div>`;
                input.value = "";
                log.scrollTop = log.scrollHeight;
                
                try {
                    const response = await fetch('/api/chat/kiemaen', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ message: msg })
                    });
                    const data = await response.json();
                    
                    let replyText = data.status === 'error' ? 'Connection Error.' : data.response;
                    log.innerHTML += `<div class="message msg-ai"><svg style="width:16px;height:16px;margin-right:5px;vertical-align:middle" viewBox="0 0 100 100"><use href="#flower-shape"/></svg> <b>Kiemaen:</b><br>${replyText}</div>`;
                } catch (err) {
                    log.innerHTML += `<div class="message msg-ai" style="color:#ef4444;">System Offline.</div>`;
                }
                log.scrollTop = log.scrollHeight;
            }
        }
    </script>
</body>
</html>
