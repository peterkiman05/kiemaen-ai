<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kiemaen OS | Master Control</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #0a0a0a; color: #00ffcc; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #111; padding: 20px; border-right: 1px solid #333; }
        .sidebar h2 { color: #fff; text-align: center; margin-bottom: 40px; }
        .nav-btn { display: block; width: 100%; background: transparent; color: #aaa; border: 1px solid #333; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.3s; text-align: left; font-size: 16px; }
        .nav-btn:hover, .nav-btn.active { background: #00ffcc; color: #000; font-weight: bold; }
        .content { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .panel { display: none; }
        .panel.active { display: block; }
        input, select, textarea { width: 100%; background: #222; color: #00ffcc; border: 1px solid #555; padding: 10px; margin-top: 10px; margin-bottom: 20px; font-family: inherit; }
        button.action-btn { background: #00ffcc; color: #000; padding: 12px 20px; border: none; cursor: pointer; font-weight: bold; width: 100%; }
        button.action-btn:hover { background: #00ccaa; }
        .chat-box { background: #111; height: 300px; border: 1px solid #333; padding: 10px; overflow-y: auto; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>KIEMAEN OS</h2>
        <button class="nav-btn active" onclick="switchTab('kiemaen')">1. Kiemaen Classic</button>
        <button class="nav-btn" onclick="switchTab('kim')">2. Kim (Trading Desk)</button>
        <button class="nav-btn" onclick="switchTab('kit')">3. Kit (B2B Pipeline)</button>
        <button class="nav-btn" onclick="switchTab('kat')">4. Kat (VIP Clients)</button>
    </div>

    <div class="content">
        <!-- 1. Kiemaen Classic -->
        <div id="kiemaen" class="panel active">
            <h2>System: Original Kiemaen</h2>
            <div class="chat-box" id="chat-log">Welcome back, Jacob. System online.</div>
            <input type="text" id="chat-input" placeholder="Command Kiemaen...">
            <button class="action-btn" onclick="sendChat()">Send Command</button>
        </div>

        <!-- 2. Kim's Interface -->
        <div id="kim" class="panel">
            <h2>System: Kim (Quantitative Ops)</h2>
            <label>Select Account:</label>
            <select id="kim-account">
                <option value="vault_main">Vault Markets - Main Fund</option>
                <option value="paper_trade">Paper Trading / Backtest</option>
            </select>
            <label>Target Trading Pair:</label>
            <input type="text" id="kim-pair" placeholder="e.g. XAUUSD, GBPJPY">
            <button class="action-btn" onclick="sendCommand('kim')">Initialize Algorithm</button>
        </div>

        <!-- 3. Kit's Interface -->
        <div id="kit" class="panel">
            <h2>System: Kit (Growth & B2B)</h2>
            <label>Special Instructions / Target Market:</label>
            <textarea id="kit-instructions" rows="5" placeholder="e.g. Pivot outreach to prop firms in London. Focus on AI risk mitigation..."></textarea>
            <button class="action-btn" onclick="sendCommand('kit')">Update Directives</button>
        </div>

        <!-- 4. Kat's Interface -->
        <div id="kat" class="panel">
            <h2>System: Kat (Client Relations)</h2>
            <label>VIP Handling Instructions:</label>
            <textarea id="kat-instructions" rows="5" placeholder="e.g. Offer a 20% discount on VIP signals this week only."></textarea>
            <button class="action-btn" onclick="sendCommand('kat')">Deploy Directives</button>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        async function sendCommand(agent) {
            alert(`Instructions sent to ${agent.toUpperCase()}. Database updated.`);
            // Future tie-in to FastAPI endpoints goes here
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const log = document.getElementById('chat-log');
            if(input.value.trim() !== "") {
                log.innerHTML += `<br><b style="color:#fff">Jacob:</b> ${input.value}`;
                log.innerHTML += `<br><b style="color:#00ffcc">Kiemaen:</b> Acknowledged. Processing command.`;
                input.value = "";
                log.scrollTop = log.scrollHeight;
            }
        }
    </script>
</body>
</html>
