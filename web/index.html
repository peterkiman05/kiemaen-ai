<style>
body { background:#131314; color:#e3e3e3; font-family:'Inter',sans-serif; margin:0; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
#header { display:flex; align-items:center; justify-content:space-between; padding:15px 20px; background:#1e1f20; border-bottom:1px solid #333; }
.header-left { display:flex; align-items:center; gap:15px; }
.menu-btn { background:none; border:none; color:#c4c7c5; cursor:pointer; display:flex; }
.brand { font-size:18px; font-weight:500; }
.badge { font-size:11px; background:#8ab4f8; color:#131314; padding:3px 8px; border-radius:10px; font-weight:600; }
.login-btn { background:#282a2c; border:1px solid #444; color:#e3e3e3; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:13px; }

#overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:998; }
#sidebar { position:fixed; top:0; left:-320px; width:300px; height:100vh; background:#1e1f20; z-index:999; transition:left .3s; display:flex; flex-direction:column; border-right:1px solid #333; }
#sidebar.open { left:0; } #overlay.open { display:block; }
.sidebar-header { padding:20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; }
.sidebar-content { padding:20px; flex-grow:1; display:flex; flex-direction:column; gap:20px; }

.message.error .bubble { color:#ff8a80; background:#3a1c1c; border-radius:12px; padding:15px; border:1px solid #ff5555; }
.category-tag { font-size:11px; color:#8ab4f8; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px; }

pre { margin:15px 0; border-radius:12px; overflow:hidden; background:#1e1f20; border:1px solid #333; }
.code-header { background:#282a2c; padding:8px 15px; display:flex; justify-content:space-between; border-bottom:1px solid #333; }
.code-actions button { background:transparent; border:1px solid #555; color:#c4c7c5; padding:4px 10px; border-radius:15px; font-size:12px; cursor:pointer; }

#input-area { width:100%; max-width:800px; margin:0 auto; padding:15px 20px 20px; box-sizing:border-box; }
.input-wrapper { display:flex; align-items:flex-end; background:#1e1f20; border-radius:26px; padding:8px 12px; border:1px solid #333; gap:5px; }
textarea { flex-grow:1; background:transparent; border:none; color:#e3e3e3; font-size:16px; padding:12px 5px; outline:none; resize:none; max-height:150px; font-family:'Inter',sans-serif;}
.icon-btn { background:transparent; border:none; color:#c4c7c5; cursor:pointer; padding:10px; border-radius:50%; height:44px; width:44px; display:flex; align-items:center; justify-content:center; }
.icon-btn:hover { background:#333538; }
.icon-btn.active-toggle { color:#8ab4f8; }
.jarvis-active { background:#441111!important; color:#ff5555!important; animation:pulse 1.5s infinite; }
@keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.08);} 100%{transform:scale(1);} }

.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1001; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal-box { background:#1e1f20; padding:30px; border-radius:16px; width:300px; display:flex; flex-direction:column; gap:12px; border:1px solid #333; }
.modal-box h2 { margin:0 0 10px; font-size:20px; }
.modal-box input { background:#131314; border:1px solid #333; color:#e3e3e3; padding:10px; border-radius:8px; outline:none; }
.modal-box button.submit { background:#8ab4f8; color:#131314; border:none; padding:10px; border-radius:20px; font-weight:600; cursor:pointer; }
.modal-box .switch-link { color:#8ab4f8; font-size:13px; text-align:center; cursor:pointer; }
.modal-box .close-x { align-self:flex-end; cursor:pointer; color:#888; }

<style id="kiemaen-fix-v4">

<body>

<div id="overlay" onclick="toggleSidebar()"></div>
<div id="sidebar">
  <div class="sidebar-header">
    <span class="brand">Menu</span>
    <button class="menu-btn" onclick="toggleSidebar()"><span class="material-symbols-outlined">close</span></button>
  </div>
  <div class="sidebar-content">
    <button class="new-chat-btn" onclick="newChat()"><span class="material-symbols-outlined">add</span> New Chat</button>
    <div class="notebook-area">
      <h3 style="margin:0;font-size:14px;color:#c4c7c5;display:flex;align-items:center;gap:5px;"><span class="material-symbols-outlined">edit_note</span> Notebook</h3>
      <textarea id="notebookText" placeholder="Save snippets or notes here..."></textarea>
    </div>
  </div>
</div>

<div id="header">
  <div class="header-left">
    <button class="menu-btn" onclick="toggleSidebar()"><span class="material-symbols-outlined">menu</span></button>
    <span class="brand">Kiemaen AGI</span>
    <span id="adminBadge" class="badge" style="display:none;">ADMIN</span>
  </div>
  <button class="login-btn" id="authBtn" onclick="openAuthModal()">Login</button>
</div>

<div id="chat-wrapper"><div id="chat-container"></div></div>

<div id="input-area">
  <div class="input-wrapper">
    <input type="file" id="imageInput" accept="image/*" style="display:none">
    <button class="icon-btn" onclick="document.getElementById('imageInput').click()" title="Upload Image">
      <span class="material-symbols-outlined">image</span>
    </button>
    <button class="icon-btn" id="ttsToggle" onclick="toggleTTS()" title="Read Aloud">
      <span class="material-symbols-outlined">volume_up</span>
    </button>
    <textarea id="userInput" rows="1" placeholder="Ask Kiemaen..." oninput="handleInput()" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); if(this.value.trim()) sendMessage();}"></textarea>
    <button class="icon-btn" id="actionBtn" onclick="handleAction()" title="Voice Mode">
      <span class="material-symbols-outlined" id="actionIcon">mic</span>
    </button>
  </div>
</div>

<div class="modal-overlay" id="authModal">
  <div class="modal-box">
    <span class="close-x" onclick="closeAuthModal()">&#10005;</span>
    <h2 id="authTitle">Login</h2>
    <input type="text" id="authUsername" placeholder="Username">
    <input type="password" id="authPassword" placeholder="Password">
    <button class="submit" id="authSubmitBtn" onclick="submitAuth()">Login</button>
    <span class="switch-link" id="authSwitch" onclick="switchAuthMode()">Don't have an account? Register</span>
  </div>
</div>

<script>
let token = localStorage.getItem('kiemaen_token') || null;
let isAdmin = false;
let authMode = 'login';
let ttsEnabled = true;

const notebook = document.getElementById('notebookText');
notebook.value = localStorage.getItem('kiemaen_notebook') || '';
notebook.addEventListener('input', () => localStorage.setItem('kiemaen_notebook', notebook.value));

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function newChat() {
  document.getElementById('chat-container').innerHTML = '';
  toggleSidebar();
  addMessage("New session started.", "bot");
}

function openAuthModal(){ document.getElementById('authModal').classList.add('open'); }
function closeAuthModal(){ document.getElementById('authModal').classList.remove('open'); }
function switchAuthMode(){
  authMode = authMode === 'login' ? 'register' : 'login';
  document.getElementById('authTitle').innerText = authMode === 'login' ? 'Login' : 'Register';
  document.getElementById('authSubmitBtn').innerText = authMode === 'login' ? 'Login' : 'Create Account';
  document.getElementById('authSwitch').innerText = authMode === 'login' ? "Don't have an account? Register" : "Already have an account? Login";
}
async function submitAuth(){
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  if(!username || !password) return;
  const fd = new FormData();
  fd.append('username', username);
  fd.append('password', password);
  const endpoint = authMode === 'login' ? '/login' : '/register';
  const res = await fetch(endpoint, { method:'POST', body: fd });
  const data = await res.json();
  if(data.status === 'ok'){
    token = data.token;
    localStorage.setItem('kiemaen_token', token);
    isAdmin = data.is_admin;
    updateAuthUI(data.username, data.is_admin);
    closeAuthModal();
  } else {
    alert(data.message);
  }
}
function updateAuthUI(username, admin){
  document.getElementById('authBtn').innerText = username;
  document.getElementById('adminBadge').style.display = admin ? 'inline-block' : 'none';
}
async function checkSession(){
  if(!token) return;
  const res = await fetch('/me', { headers: { 'X-Session-Token': token } });
  const data = await res.json();
  if(data.username && data.username !== 'guest'){
    isAdmin = data.is_admin;
    updateAuthUI(data.username, data.is_admin);
  }
}
checkSession();

function handleInput(){
  const input = document.getElementById("userInput");
  const icon = document.getElementById("actionIcon");
  input.style.height = '';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
  if(input.value.trim().length > 0){
    icon.innerText = "send";
    updateMicVisual('idle');
  } else {
    icon.innerText = "mic";
    if(jarvisMode) updateMicVisual(voiceState);
  }
}
function handleAction(){
  const icon = document.getElementById("actionIcon").innerText;
  if(icon === "send") sendMessage();
  else toggleJarvis();
}

function toggleTTS(){
  ttsEnabled = !ttsEnabled;
  const btn = document.getElementById('ttsToggle');
  btn.classList.toggle('active-toggle', ttsEnabled);
  if(!ttsEnabled) window.speechSynthesis.cancel();
}
document.getElementById('ttsToggle').classList.add('active-toggle');

/* ================= VOICE ENGINE (rebuilt) ================= */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let jarvisMode = false;
let voiceState = 'idle'; // idle | listening | speaking | thinking
let recognitionActive = false;
let restartTimer = null;

function updateMicVisual(state){
  voiceState = state;
  const btn = document.getElementById('actionBtn');
  btn.classList.remove('jarvis-active');
  if(!jarvisMode) return;
  if(state === 'listening' || state === 'speaking' || state === 'thinking'){
    btn.classList.add('jarvis-active');
  }
  btn.title = state === 'listening' ? 'Listening...' :
              state === 'speaking' ? 'Speaking...' :
              state === 'thinking' ? 'Processing...' : 'Voice Mode';
}

function safeStartRecognition(){
  if(!recognition || recognitionActive || !jarvisMode) return;
  if(voiceState === 'speaking' || voiceState === 'thinking') return;
  clearTimeout(restartTimer);
  restartTimer = setTimeout(() => {
    if(!jarvisMode || recognitionActive) return;
    try {
      recognition.start();
    } catch(e){
      // Already started or transient error - ignore, next cycle will retry
      console.warn('Recognition start skipped:', e.message);
    }
  }, 350);
}

if(SpeechRecognitionAPI){
  recognition = new SpeechRecognitionAPI();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onstart = () => {
    recognitionActive = true;
    updateMicVisual('listening');
  };

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    document.getElementById("userInput").value = text;
    updateMicVisual('thinking');
    sendMessage();
  };

  recognition.onend = () => {
    recognitionActive = false;
    if(jarvisMode && voiceState !== 'speaking' && voiceState !== 'thinking'){
      updateMicVisual('idle');
      safeStartRecognition();
    }
  };

  recognition.onerror = (e) => {
    recognitionActive = false;
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      jarvisMode = false;
      updateMicVisual('idle');
      addMessage("Microphone access was blocked. Please allow mic permission in your browser settings and try again.", "error");
      return;
    }
    if(jarvisMode && (e.error === 'no-speech' || e.error === 'network' || e.error === 'aborted')){
      safeStartRecognition();
    }
  };
} else {
  console.warn("SpeechRecognition not supported in this browser.");
}

function toggleJarvis(){
  if(!recognition){
    addMessage("Voice input is not supported in this browser. Try Chrome on Android.", "error");
    return;
  }
  jarvisMode = !jarvisMode;
  if(jarvisMode){
    // Unlock TTS engine with a near-silent utterance triggered by this user tap
    try {
      const unlock = new SpeechSynthesisUtterance(' ');
      unlock.volume = 0;
      window.speechSynthesis.speak(unlock);
    } catch(e){}
    safeStartRecognition();
  } else {
    clearTimeout(restartTimer);
    if(recognitionActive){ try { recognition.stop(); } catch(e){} }
    window.speechSynthesis.cancel();
    updateMicVisual('idle');
  }
}

function speak(text){
  if(!ttsEnabled || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();

  if(jarvisMode){
    clearTimeout(restartTimer);
    if(recognitionActive){ try { recognition.stop(); } catch(e){} }
    updateMicVisual('speaking');
  }

  let cleanText = text.replace(/```[\s\S]*?```/g, "Code provided on screen.")
                       .replace(/[*_#]/g, "")
                       .replace(/<[^>]*>?/gm, '');

  if(!cleanText.trim()){
    if(jarvisMode) safeStartRecognition();
    return;
  }

  let utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.rate = 1.05;

  utterance.onend = () => {
    if(jarvisMode){
      updateMicVisual('idle');
      safeStartRecognition();
    }
  };
  utterance.onerror = () => {
    if(jarvisMode){
      updateMicVisual('idle');
      safeStartRecognition();
    }
  };

  window.speechSynthesis.speak(utterance);
}
/* =============== END VOICE ENGINE =============== */

function addMessage(text, sender, category){
  const chat = document.getElementById("chat-container");
  const wrapper = document.getElementById("chat-wrapper");

  const msgDiv = document.createElement("div");
  msgDiv.className = `message ${sender}`;

  if(sender === 'bot' && category && category !== 'general'){
    const tag = document.createElement("div");
    tag.className = "category-tag";
    tag.innerText = category.replace('_',' ');
    msgDiv.appendChild(tag);
  }

  const bubbleDiv = document.createElement("div");
  bubbleDiv.className = "bubble";

  if(sender === 'bot'){
    bubbleDiv.innerHTML = marked.parse(String(text));
    bubbleDiv.querySelectorAll("pre code").forEach((block) => {
      hljs.highlightElement(block);
      const pre = block.parentElement;
      const header = document.createElement("div");
      header.className = "code-header";
      const lang = document.createElement("span");
      lang.style.cssText = "font-size:12px;color:#888;text-transform:uppercase;";
      lang.innerText = block.className.replace('hljs','').trim() || "code";
      const actions = document.createElement("div");
      actions.className = "code-actions";
      const copyBtn = document.createElement("button");
      copyBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">content_copy</span>';
      copyBtn.onclick = () => navigator.clipboard.writeText(block.innerText);
      const playBtn = document.createElement("button");
      playBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">play_arrow</span>';
      playBtn.onclick = () => { const win = window.open("", "_blank"); win.document.write(block.innerText); };
      actions.append(copyBtn, playBtn);
      header.append(lang, actions);
      pre.parentNode.insertBefore(header, pre);
    });
  } else {
    bubbleDiv.innerText = String(text);
  }

  msgDiv.appendChild(bubbleDiv);
  chat.appendChild(msgDiv);
  setTimeout(() => { wrapper.scrollTop = wrapper.scrollHeight; }, 100);
}

async function sendMessage(){
  const input = document.getElementById("userInput");
  const imageInput = document.getElementById("imageInput");
  const text = input.value.trim();
  const file = imageInput.files[0];
  if(!text && !file) return;

  addMessage(text || "[Image Attached]", "user");
  input.value = "";
  handleInput();

  const formData = new FormData();
  if(text){ formData.append("msg", text); formData.append("prompt", text); }
  if(file){ formData.append("image", file); imageInput.value = ""; }

  const loadingId = "load-" + Date.now();
  document.getElementById("chat-container").insertAdjacentHTML('beforeend',
    `<div id="${loadingId}" class="message bot"><div class="bubble">Thinking...</div></div>`);
  document.getElementById("chat-wrapper").scrollTop = document.getElementById("chat-wrapper").scrollHeight;

  try {
    const headers = {};
    if(token) headers['X-Session-Token'] = token;
    let response = await fetch("/chat", { method: "POST", body: formData, headers });
    document.getElementById(loadingId)?.remove();

    if(!response.ok){
      throw new Error(`Connection issue (${response.status}).`);
    }
    let result = await response.json();

    let finalResponse = result.response || result.reply || result.message || "Done.";
    if(Array.isArray(finalResponse)) finalResponse = finalResponse[0];
    finalResponse = String(finalResponse);

    if(result.status === 'error'){
      addMessage(finalResponse, "error");
      if(jarvisMode){ updateMicVisual('idle'); safeStartRecognition(); }
    } else {
      addMessage(finalResponse, "bot", result.category);
      speak(finalResponse);
    }
  } catch(error){
    document.getElementById(loadingId)?.remove();
    addMessage("I ran into an issue processing that. Please try again.", "error");
    if(jarvisMode){ updateMicVisual('idle'); safeStartRecognition(); }
  }
}
</script>

<script id="kiemaen-fix-v4-js">
(function(){
  function init(){
    var container = document.getElementById('chat-container');
    var old = document.getElementById('kiemaenEmptyState');
    if (old) old.remove();
    if (container && !document.getElementById('kiemaenEmptyState')) {
      var empty = document.createElement('div');
      empty.className = 'kiemaen-empty-state';
      empty.id = 'kiemaenEmptyState';
      empty.innerHTML = '<svg class=\"kiemaen-clover-logo\" viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"cloverGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\"><stop offset=\"0%\" stop-color=\"#7fb2ff\"/><stop offset=\"45%\" stop-color=\"#1a73e8\"/><stop offset=\"100%\" stop-color=\"#05070d\"/></linearGradient></defs><g transform=\"translate(100,100)\"><g id=\"leafGroup\"><path d=\"M0,0 C-8,-25 -55,-30 -58,-68 C-60,-95 -30,-110 0,-85 C30,-110 60,-95 58,-68 C55,-30 8,-25 0,0 Z\" fill=\"url(#cloverGrad)\"/></g><use href=\"#leafGroup\" transform=\"rotate(72)\"/><use href=\"#leafGroup\" transform=\"rotate(144)\"/><use href=\"#leafGroup\" transform=\"rotate(216)\"/><use href=\"#leafGroup\" transform=\"rotate(288)\"/><circle r=\"12\" fill=\"#05070d\" stroke=\"#4285f4\" stroke-width=\"2.5\"/></g></svg><h1>Kiemaen AI</h1><p class="tagline">Your ultimate agentic assistant</p>';
      container.prepend(empty);

      var observer = new MutationObserver(function(){
        var hasMessages = container.querySelectorAll('.message').length > 0;
        empty.style.display = hasMessages ? 'none' : 'flex';
      });
      observer.observe(container, { childList: true });
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  setTimeout(init, 300);
})();
</script>
