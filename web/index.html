    <input type="email" id="authEmail" placeholder="Email" style="display:none;">
    <input type="password" id="authPassword" placeholder="Password">
    <input type="text" id="authCode" placeholder="6-digit verification code" style="display:none;">
    <button class="submit" id="authSubmitBtn" onclick="submitAuth()">Login</button>
    <button class="submit" id="authVerifyBtn" onclick="submitVerifyCode()" style="display:none;">Verify & Create Account</button>
    <span class="switch-link" id="authSwitch" onclick="switchAuthMode()">Don't have an account? Register</span>
  </div>
</div>

<script>
let token = localStorage.getItem('kiemaen_token') || null;
let isAdmin = false;
let authMode = 'login';
let ttsEnabled = true;

const notebook = document.getElementById('notebookText');
notebook.value = localStorage.getItem('kiemaen_notebook') || '';
notebook.addEventListener('input', () => localStorage.setItem('kiemaen_notebook', notebook.value));

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function newChat() {
  document.getElementById('chat-container').innerHTML = '';
  toggleSidebar();
  addMessage("New session started.", "bot");
}

function openAuthModal(){ document.getElementById('authModal').classList.add('open'); }
function closeAuthModal(){ document.getElementById('authModal').classList.remove('open'); }
function switchAuthMode(){
  authMode = authMode === 'login' ? 'register' : 'login';
  resetAuthModal();
  document.getElementById('authTitle').innerText = authMode === 'login' ? 'Login' : 'Register';
  document.getElementById('authSubmitBtn').innerText = authMode === 'login' ? 'Login' : 'Send Verification Code';
  document.getElementById('authSwitch').innerText = authMode === 'login' ? "Don't have an account? Register" : "Already have an account? Login";
}
let pendingVerifyEmail = null;
let pendingVerifyUsername = null;

async function submitAuth(){
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;

  if(authMode === 'login'){
    if(!username || !password) return;
    const fd = new FormData();
    fd.append('username', username);
    fd.append('password', password);
    const res = await fetch('/login', { method:'POST', body: fd });
    const data = await res.json();
    if(data.status === 'ok'){
      token = data.token;
      localStorage.setItem('kiemaen_token', token);
      isAdmin = data.is_admin;
      updateAuthUI(data.username, data.is_admin);
      closeAuthModal();
    } else if(data.status === 'verification_required'){
      pendingVerifyEmail = null;
      pendingVerifyUsername = data.username;
      document.getElementById('authUsername').style.display = 'none';
      document.getElementById('authEmail').style.display = 'none';
      document.getElementById('authPassword').style.display = 'none';
      document.getElementById('authSubmitBtn').style.display = 'none';
      document.getElementById('authCode').style.display = 'block';
      document.getElementById('authVerifyBtn').style.display = 'block';
      document.getElementById('authVerifyBtn').onclick = submitLoginVerifyCode;
    } else {
      alert(data.message);
    }
    return;
  }

  // Register mode - phase 1: request the code
  const email = document.getElementById('authEmail').value.trim();
  if(!username || !email || !password){ alert('Please fill in all fields.'); return; }

  const fd = new FormData();
  fd.append('username', username);
  fd.append('email', email);
  fd.append('password', password);
  const res = await fetch('/register/request-code', { method:'POST', body: fd });
  const data = await res.json();
  if(data.status === 'ok'){
    pendingVerifyEmail = email;
    document.getElementById('authUsername').style.display = 'none';
    document.getElementById('authEmail').style.display = 'none';
    document.getElementById('authPassword').style.display = 'none';
    document.getElementById('authSubmitBtn').style.display = 'none';
    document.getElementById('authCode').style.display = 'block';
    document.getElementById('authVerifyBtn').style.display = 'block';
    document.getElementById('authTitle').innerText = 'Check your email';
  } else {
    alert(data.message);
  }
}

async function submitVerifyCode(){
  const code = document.getElementById('authCode').value.trim();
  if(!code || !pendingVerifyEmail) return;
  const fd = new FormData();
  fd.append('email', pendingVerifyEmail);
  fd.append('code', code);
  const res = await fetch('/register/verify', { method:'POST', body: fd });
  const data = await res.json();
  if(data.status === 'ok'){
    token = data.token;
    localStorage.setItem('kiemaen_token', token);
    isAdmin = data.is_admin;
    updateAuthUI(data.username, data.is_admin);
    closeAuthModal();
    resetAuthModal();
  } else {
    alert(data.message);
  }
}

async function submitLoginVerifyCode(){
  const code = document.getElementById('authCode').value.trim();
  if(!code || !pendingVerifyUsername) return;
  const fd = new FormData();
  fd.append('username', pendingVerifyUsername);
  fd.append('code', code);
  const res = await fetch('/login/verify', { method:'POST', body: fd });
  const data = await res.json();
  if(data.status === 'ok'){
    token = data.token;
    localStorage.setItem('kiemaen_token', token);
    isAdmin = data.is_admin;
    updateAuthUI(data.username, data.is_admin);
    closeAuthModal();
    resetAuthModal();
  } else {
    alert(data.message);
  }
}

function resetAuthModal(){
  document.getElementById('authVerifyBtn').onclick = submitVerifyCode;
  document.getElementById('authVerifyBtn').onclick = submitVerifyCode;
  pendingVerifyEmail = null;
  document.getElementById('authUsername').style.display = 'block';
  document.getElementById('authEmail').style.display = authMode === 'register' ? 'block' : 'none';
  document.getElementById('authPassword').style.display = 'block';
  document.getElementById('authCode').style.display = 'none';
  document.getElementById('authSubmitBtn').style.display = 'block';
  document.getElementById('authVerifyBtn').style.display = 'none';
  document.getElementById('authUsername').value = '';
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('authCode').value = '';
}
async function doLogout(){
  if(token){
    try{ await fetch('/logout', { method:'POST', headers: { 'X-Session-Token': token } }); }catch(e){}
  }
  localStorage.removeItem('kiemaen_token');
  token = null;
  isAdmin = false;
  document.getElementById('authBtn').innerText = 'Login';
  document.getElementById('authBtn').style.display = 'inline-block';
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('adminBadge').style.display = 'none';
  location.reload();
}

function updateAuthUI(username, admin){
  document.getElementById('authBtn').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'inline-block';
  document.getElementById('logoutBtn').innerText = username + ' (Logout)';
  document.getElementById('adminBadge').style.display = admin ? 'inline-block' : 'none';
}
async function checkSession(){
  if(!token) return;
  const res = await fetch('/me', { headers: { 'X-Session-Token': token } });
  const data = await res.json();
  if(data.username && data.username !== 'guest'){
    isAdmin = data.is_admin;
    updateAuthUI(data.username, data.is_admin);
  }
}
checkSession();

function handleInput(){
  const input = document.getElementById("userInput");
  const icon = document.getElementById("actionIcon");
  input.style.height = '';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
  if(input.value.trim().length > 0){
    icon.innerText = "send";
    updateMicVisual('idle');
  } else {
    icon.innerText = "mic";
    if(jarvisMode) updateMicVisual(voiceState);
  }
}
function handleAction(){
  const icon = document.getElementById("actionIcon").innerText;
  if(icon === "send") sendMessage();
  else toggleJarvis();
}

function toggleTTS(){
  ttsEnabled = !ttsEnabled;
  const btn = document.getElementById('ttsToggle');
  btn.classList.toggle('active-toggle', ttsEnabled);
  if(!ttsEnabled) window.speechSynthesis.cancel();
}
document.getElementById('ttsToggle').classList.add('active-toggle');

/* ================= VOICE ENGINE (rebuilt) ================= */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let jarvisMode = false;
let voiceState = 'idle'; // idle | listening | speaking | thinking
let recognitionActive = false;
let restartTimer = null;

function updateMicVisual(state){
  voiceState = state;
  const btn = document.getElementById('actionBtn');
  btn.classList.remove('jarvis-active');
  if(!jarvisMode) return;
  if(state === 'listening' || state === 'speaking' || state === 'thinking'){
    btn.classList.add('jarvis-active');
  }
  btn.title = state === 'listening' ? 'Listening...' :
              state === 'speaking' ? 'Speaking...' :
              state === 'thinking' ? 'Processing...' : 'Voice Mode';
}

function safeStartRecognition(){
  if(!recognition || recognitionActive || !jarvisMode) return;
  if(voiceState === 'speaking' || voiceState === 'thinking') return;
  clearTimeout(restartTimer);
  restartTimer = setTimeout(() => {
    if(!jarvisMode || recognitionActive) return;
    try {
      recognition.start();
    } catch(e){
      // Already started or transient error - ignore, next cycle will retry
      console.warn('Recognition start skipped:', e.message);
    }
  }, 350);
}

if(SpeechRecognitionAPI){
  recognition = new SpeechRecognitionAPI();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onstart = () => {
    recognitionActive = true;
    updateMicVisual('listening');
  };

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    document.getElementById("userInput").value = text;
    updateMicVisual('thinking');
    sendMessage();
  };

  recognition.onend = () => {
    recognitionActive = false;
    if(jarvisMode && voiceState !== 'speaking' && voiceState !== 'thinking'){
      updateMicVisual('idle');
      safeStartRecognition();
    }
  };

  recognition.onerror = (e) => {
    recognitionActive = false;
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      jarvisMode = false;
      updateMicVisual('idle');
      addMessage("Microphone access was blocked. Please allow mic permission in your browser settings and try again.", "error");
      return;
    }
    if(jarvisMode && (e.error === 'no-speech' || e.error === 'network' || e.error === 'aborted')){
      safeStartRecognition();
    }
  };
} else {
  console.warn("SpeechRecognition not supported in this browser.");
}

function toggleJarvis(){
  if(!recognition){
    addMessage("Voice input is not supported in this browser. Try Chrome on Android.", "error");
    return;
  }
  jarvisMode = !jarvisMode;
  if(jarvisMode){
    // Unlock TTS engine with a near-silent utterance triggered by this user tap
    try {
      const unlock = new SpeechSynthesisUtterance(' ');
      unlock.volume = 0;
      window.speechSynthesis.speak(unlock);
    } catch(e){}
    safeStartRecognition();
  } else {
    clearTimeout(restartTimer);
    if(recognitionActive){ try { recognition.stop(); } catch(e){} }
    window.speechSynthesis.cancel();
    updateMicVisual('idle');
  }
}

function speak(text){
  if(!jarvisMode || !ttsEnabled || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();

  if(jarvisMode){
    clearTimeout(restartTimer);
    if(recognitionActive){ try { recognition.stop(); } catch(e){} }
    updateMicVisual('speaking');
  }

  let cleanText = text.replace(/```[\s\S]*?```/g, "Code provided on screen.")
                       .replace(/[*_#]/g, "")
                       .replace(/<[^>]*>?/gm, '');

  if(!cleanText.trim()){
    if(jarvisMode) safeStartRecognition();
    return;
  }

  let utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.rate = 1.05;

  utterance.onend = () => {
    if(jarvisMode){
      updateMicVisual('idle');
      safeStartRecognition();
    }
  };
  utterance.onerror = () => {
    if(jarvisMode){
      updateMicVisual('idle');
      safeStartRecognition();
    }
  };

  window.speechSynthesis.speak(utterance);
}
/* =============== END VOICE ENGINE =============== */

function addMessage(text, sender, category){
  const chat = document.getElementById("chat-container");
  const wrapper = document.getElementById("chat-wrapper");

  const msgDiv = document.createElement("div");
  msgDiv.className = `message ${sender}`;

  if(sender === 'bot' && category && category !== 'general'){
    const tag = document.createElement("div");
    tag.className = "category-tag";
    tag.innerText = category.replace('_',' ');
    msgDiv.appendChild(tag);
  }

  const bubbleDiv = document.createElement("div");
  bubbleDiv.className = "bubble";

  if(sender === 'bot'){
    bubbleDiv.innerHTML = DOMPurify.sanitize(marked.parse(String(text)));
    const readBtn = document.createElement("button");
    readBtn.className = "read-aloud-btn";
    readBtn.innerHTML = '<span class="material-symbols-outlined">volume_up</span>';
    readBtn.onclick = () => {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(String(text));
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    };
    bubbleDiv.appendChild(readBtn);

    bubbleDiv.querySelectorAll("pre code").forEach((block) => {
      hljs.highlightElement(block);
      const pre = block.parentElement;
      const header = document.createElement("div");
      header.className = "code-header";
      const lang = document.createElement("span");
      lang.style.cssText = "font-size:12px;color:#888;text-transform:uppercase;";
      lang.innerText = block.className.replace('hljs','').trim() || "code";
      const actions = document.createElement("div");
      actions.className = "code-actions";
      const copyBtn = document.createElement("button");
      copyBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">content_copy</span>';
      copyBtn.onclick = () => navigator.clipboard.writeText(block.innerText);
      const playBtn = document.createElement("button");
      playBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">play_arrow</span>';
      playBtn.onclick = () => { const win = window.open("", "_blank"); win.document.write(block.innerText); };
      actions.append(copyBtn, playBtn);
      header.append(lang, actions);
      pre.parentNode.insertBefore(header, pre);
    });
  } else {
    bubbleDiv.innerText = String(text);
  }

  msgDiv.appendChild(bubbleDiv);
  chat.appendChild(msgDiv);
  setTimeout(() => { wrapper.scrollTop = wrapper.scrollHeight; }, 100);
}

async function sendMessage(){
  const input = document.getElementById("userInput");
  const imageInput = document.getElementById("imageInput");
  const text = input.value.trim();
  const file = imageInput.files[0];
  if(!text && !file) return;

  addMessage(text || "[Image Attached]", "user");
  input.value = "";
  handleInput();

  const formData = new FormData();
  if(text){ formData.append("msg", text); formData.append("prompt", text); }
  if(file){ formData.append("image", file); imageInput.value = ""; document.getElementById('filePreviewBar').style.display = 'none'; }

  document.getElementById('imageInput').onchange = function(){
    const f = this.files[0];
    const bar = document.getElementById('filePreviewBar');
    const nameSpan = document.getElementById('filePreviewName');
    if(f){ nameSpan.innerText = f.name; bar.style.display = 'flex'; }
    else { bar.style.display = 'none'; }
  };
  function clearFilePreview(){
    document.getElementById('imageInput').value = '';
    document.getElementById('filePreviewBar').style.display = 'none';
  }

  const loadingId = "load-" + Date.now();
  document.getElementById("chat-container").insertAdjacentHTML('beforeend',
    `<div id="${loadingId}" class="message bot"><div class="bubble">Thinking...</div></div>`);
  document.getElementById("chat-wrapper").scrollTop = document.getElementById("chat-wrapper").scrollHeight;

  try {
    const headers = {};
    if(token) headers['X-Session-Token'] = token;
    let response = await fetch("/chat", { method: "POST", body: formData, headers });
    document.getElementById(loadingId)?.remove();

    if(!response.ok){
      throw new Error(`Connection issue (${response.status}).`);
    }
    let result = await response.json();

    let finalResponse = result.response || result.reply || result.message || "Done.";
    if(Array.isArray(finalResponse)) finalResponse = finalResponse[0];
    finalResponse = String(finalResponse);

    if(result.status === 'error'){
      addMessage(finalResponse, "error");
      if(jarvisMode){ updateMicVisual('idle'); safeStartRecognition(); }
    } else {
      addMessage(finalResponse, "bot", result.category);
      speak(finalResponse);
    }
  } catch(error){
    document.getElementById(loadingId)?.remove();
    addMessage("I ran into an issue processing that. Please try again.", "error");
    if(jarvisMode){ updateMicVisual('idle'); safeStartRecognition(); }
  }
}
</script>

<script id="kiemaen-history-patch-js">
(function(){
  if (window.__kiemaenHistoryPatched) return;
  window.__kiemaenHistoryPatched = true;

  const HISTORY_KEY = 'kiemaen_chat_history';
  const CURRENT_ID_KEY = 'kiemaen_current_chat_id';

  function loadHistory(){
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveHistory(list){ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }
  function getCurrentId(){
    let id = localStorage.getItem(CURRENT_ID_KEY);
    if (!id) { id = 'chat_' + Date.now(); localStorage.setItem(CURRENT_ID_KEY, id); }
    return id;
  }
  function setCurrentId(id){ localStorage.setItem(CURRENT_ID_KEY, id); }

  function getFirstUserMessageText(){
    const container = document.getElementById('chat-container');
    if (!container) return 'New Chat';
    const userMsg = container.querySelector('.message.user .bubble');
    if (userMsg) {
      const t = userMsg.textContent.trim();
      return t.length > 34 ? t.slice(0,34) + '...' : (t || 'New Chat');
    }
    return 'New Chat';
  }

  function saveCurrentChat(){
    const container = document.getElementById('chat-container');
    if (!container) return;
    if (container.querySelectorAll('.message').length === 0) return;

    const id = getCurrentId();
    const entry = { id, title: getFirstUserMessageText(), timestamp: Date.now(), html: container.innerHTML };
    let list = loadHistory();
    const idx = list.findIndex(c => c.id === id);
    if (idx >= 0) list[idx] = entry; else list.unshift(entry);
    list = list.slice(0, 30);
    saveHistory(list);
  }

  function renderHistoryList(){
    const sidebarContent = document.querySelector('.sidebar-content');
    if (!sidebarContent) return;
    let section = document.getElementById('chatHistorySection');
    if (!section) {
      section = document.createElement('div');
      section.className = 'chat-history-section';
      section.id = 'chatHistorySection';
      const newChatBtn = sidebarContent.querySelector('.new-chat-btn');
      if (newChatBtn && newChatBtn.nextSibling) {
        sidebarContent.insertBefore(section, newChatBtn.nextSibling);
      } else {
        sidebarContent.insertBefore(section, sidebarContent.firstChild.nextSibling || null);
      }
    }
    const list = loadHistory();
    section.innerHTML = '<div class="chat-history-title">Recent Chats</div>';
    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'font-size:12px;color:#777;padding:6px 0;';
      empty.textContent = 'No previous chats yet';
      section.appendChild(empty);
      return;
    }
    list.forEach(chat => {
      const item = document.createElement('div');
      item.className = 'chat-history-item';
      item.innerHTML = '<span class="chat-title-text"></span><span class="material-symbols-outlined del-btn">close</span>';
      item.querySelector('.chat-title-text').textContent = chat.title;
      item.querySelector('.chat-title-text').onclick = () => loadChat(chat.id);
      item.querySelector('.del-btn').onclick = (e) => { e.stopPropagation(); deleteChat(chat.id); };
      section.appendChild(item);
    });
  }

  function loadChat(id){
    saveCurrentChat();
    const chat = loadHistory().find(c => c.id === id);
    const container = document.getElementById('chat-container');
    if (chat && container) {
      container.innerHTML = chat.html;
      setCurrentId(id);
    }
    if (typeof toggleSidebar === 'function') toggleSidebar();
    renderHistoryList();
  }

  function deleteChat(id){
    saveHistory(loadHistory().filter(c => c.id !== id));
    if (getCurrentId() === id) localStorage.removeItem(CURRENT_ID_KEY);
    renderHistoryList();
  }

  function wrapNewChat(){
    if (typeof window.newChat !== 'function') { setTimeout(wrapNewChat, 200); return; }
    const original = window.newChat;
    window.newChat = function(){
      saveCurrentChat();
      localStorage.removeItem(CURRENT_ID_KEY);
      original();
      renderHistoryList();
    };
  }

  function wrapSendMessage(){
    if (typeof window.sendMessage !== 'function') { setTimeout(wrapSendMessage, 200); return; }
    const original = window.sendMessage;
    window.sendMessage = async function(){
      const result = await original.apply(this, arguments);
      setTimeout(saveCurrentChat, 600);
      setTimeout(renderHistoryList, 700);
      return result;
    };
  }

  function init(){
    renderHistoryList();
    wrapNewChat();
    wrapSendMessage();
    const container = document.getElementById('chat-container');
    if (container && container.querySelectorAll('.message').length === 0) {
      const id = localStorage.getItem(CURRENT_ID_KEY);
      if (id) {
        const chat = loadHistory().find(c => c.id === id);
        if (chat) {
          container.innerHTML = chat.html;
          const emptyState = document.getElementById('kiemaenEmptyState');
          if (emptyState) emptyState.remove();
        }
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  setTimeout(init, 400);
})();
</script>
<script id="kiemaen-voice-speed-v2">
(function(){
  if (window.__kiemaenVoiceSpeedPatched) return;
  window.__kiemaenVoiceSpeedPatched = true;

  let bestVoice = null;

  function pickBestVoice(){
    if (!window.speechSynthesis) return null;
    const voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) return null;

    const preferredNames = [
      "Google US English", "Microsoft Aria Online", "Microsoft Guy Online",
      "Samantha", "Daniel", "Alex", "Google UK English Male", "Google UK English Female"
    ];
    for (const name of preferredNames) {
      const match = voices.find(v => v.name.includes(name));
      if (match) return match;
    }
    const enVoice = voices.find(v => v.lang && v.lang.startsWith("en") && !v.localService === false);
    if (enVoice) return enVoice;
    return voices[0];
  }

  function warmVoices(){
    if (!window.speechSynthesis) return;
    bestVoice = pickBestVoice();
    window.speechSynthesis.onvoiceschanged = function(){
      bestVoice = pickBestVoice();
    };
  }
  warmVoices();
  setTimeout(warmVoices, 300);
  setTimeout(warmVoices, 1000);

  // Wrap speak() to: use best voice, cancel queue instantly, slightly faster rate
  function wrapSpeak(){
    if (typeof window.speak !== 'function') { setTimeout(wrapSpeak, 200); return; }
    const originalSpeak = window.speak;
    window.speak = function(text){
      if (window.speechSynthesis) window.speechSynthesis.cancel(); // instantly clear any queued/pending speech
      const result = originalSpeak.apply(this, arguments);
      return result;
    };
  }
  wrapSpeak();

  // Patch every new SpeechSynthesisUtterance created after this point to use the best voice + faster rate
  const OriginalUtterance = window.SpeechSynthesisUtterance;
  if (OriginalUtterance) {
    window.SpeechSynthesisUtterance = function(text){
      const utter = new OriginalUtterance(text);
      if (bestVoice) utter.voice = bestVoice;
      utter.rate = 1.05;   // slightly faster than default 1.0 - snappier without sounding rushed
      utter.pitch = 1.0;
      return utter;
    };
    window.SpeechSynthesisUtterance.prototype = OriginalUtterance.prototype;
  }

  // Speed up recognition restart loop - reduce debounce delay if safeStartRecognition exists
  function speedUpRecognitionRestart(){
    if (typeof window.recognition === 'undefined' || !window.recognition) {
      setTimeout(speedUpRecognitionRestart, 300);
      return;
    }
    try {
      window.recognition.interimResults = true; // live partial results = feels instant
    } catch(e){}

    // Instant visual feedback the moment mic actually activates (not after a delay)
    window.recognition.addEventListener('audiostart', function(){
      const btn = document.getElementById('actionBtn');
      if (btn) btn.classList.add('jarvis-active');
    });
    window.recognition.addEventListener('end', function(){
      const btn = document.getElementById('actionBtn');
      if (btn && !window.jarvisMode) btn.classList.remove('jarvis-active');
    });
  }
  speedUpRecognitionRestart();

  // Show "Thinking..." indicator INSTANTLY on send (0ms) instead of waiting on network
  function wrapSendMessage(){
    if (typeof window.sendMessage !== 'function') { setTimeout(wrapSendMessage, 200); return; }
    const originalSend = window.sendMessage;
    window.sendMessage = async function(){
      const btn = document.getElementById('actionBtn');
      if (btn) btn.style.opacity = '0.6'; // immediate visual "processing" cue
      try {
        return await originalSend.apply(this, arguments);
      } finally {
        if (btn) btn.style.opacity = '1';
      }
    };
  }
  wrapSendMessage();

  console.log('[Kiemaen] Voice speed + natural voice patch applied.');
})();
</script>
