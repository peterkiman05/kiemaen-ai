<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiemaen AGI</title>
    <style>
        :root {
            --bg-dark: #070a14;
            --input-bg: #161f33;
            --text-secondary: #9ca3af;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-dark); color: #ffffff; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* New Blue & Black Text Gradient */
        .blue-black-text {
            background: linear-gradient(135deg, #60a5fa 0%, #1e3a8a 40%, #000000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 12px rgba(59, 130, 246, 0.2));
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background-color: var(--bg-dark); border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10; }
        .menu-icon { font-size: 24px; cursor: pointer; color: #fff; user-select: none; }
        .header-title { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
        .login-btn { background-color: rgba(255,255,255,0.1); color: #fff; border: none; padding: 6px 18px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        
        .main-container { flex-grow: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .hero-center { position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .hero-center h1 { font-size: 34px; font-weight: 800; margin-top: 15px; letter-spacing: -0.5px; }
        
        .chat-scroll { flex-grow: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }
        .message { margin-bottom: 20px; max-width: 85%; line-height: 1.5; font-size: 15px; }
        .msg-user { margin-left: auto; background-color: var(--input-bg); padding: 12px 18px; border-radius: 18px 18px 0 18px; color: #fff; border: 1px solid rgba(255,255,255,0.05); }
        .msg-ai { margin-right: auto; padding: 12px 0; color: #e5e7eb; }

        .input-wrapper { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px 20px; box-sizing: border-box; background: linear-gradient(transparent, var(--bg-dark) 30%); }
        .input-bar { display: flex; align-items: center; background-color: var(--input-bg); border-radius: 35px; padding: 10px 18px; gap: 12px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        .icon-btn { background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
        .input-field { flex-grow: 1; background: transparent; border: none; color: #fff; font-size: 16px; outline: none; padding: 4px 0; }
        .input-field::placeholder { color: var(--text-secondary); }

        .flower-logo { width: 90px; height: 90px; filter: drop-shadow(0 0 15px rgba(29, 78, 216, 0.6)); }
        .flower-btn { width: 30px; height: 30px; filter: drop-shadow(0 0 8px rgba(29, 78, 216, 0.8)); cursor: pointer; }
    </style>
</head>
<body>
    <!-- Updated SVG: Pointy Petals + Blue/Black Gradient -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <radialGradient id="blueBlackGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#000000"/>
                <stop offset="40%" stop-color="#1e3a8a"/>
                <stop offset="100%" stop-color="#3b82f6"/>
            </radialGradient>
            <g id="pointy-flower">
                <!-- Using Quadratic Beziers (Q) to forge sharp tips at (50,0) -->
                <path d="M50 50 Q 35 25, 50 0 Q 65 25, 50 50" fill="url(#blueBlackGlow)" transform="rotate(0 50 50)"/>
                <path d="M50 50 Q 35 25, 50 0 Q 65 25, 50 50" fill="url(#blueBlackGlow)" transform="rotate(72 50 50)"/>
                <path d="M50 50 Q 35 25, 50 0 Q 65 25, 50 50" fill="url(#blueBlackGlow)" transform="rotate(144 50 50)"/>
                <path d="M50 50 Q 35 25, 50 0 Q 65 25, 50 50" fill="url(#blueBlackGlow)" transform="rotate(216 50 50)"/>
                <path d="M50 50 Q 35 25, 50 0 Q 65 25, 50 50" fill="url(#blueBlackGlow)" transform="rotate(288 50 50)"/>
                <circle cx="50" cy="50" r="4" fill="#000000"/>
            </g>
        </defs>
    </svg>

    <div class="top-bar">
        <div class="menu-icon">≡</div>
        <div class="header-title blue-black-text">Kiemaen AGI</div>
        <button class="login-btn" onclick="alert('CEO Authenticated')">Login</button>
    </div>

    <div class="main-container">
        <div class="hero-center" id="hero-logo">
            <svg class="flower-logo" viewBox="0 0 100 100"><use href="#pointy-flower"/></svg>
            <h1 class="blue-black-text">Kiemaen AI</h1>
        </div>
        <div class="chat-scroll" id="chat-log"></div>
        <div class="input-wrapper">
            <div class="input-bar">
                <button class="icon-btn">📎</button>
                <input type="text" class="input-field" id="chat-input" placeholder="Message Kiemaen..." onkeypress="if(event.key === 'Enter') sendChat()">
                <button class="icon-btn">🎤</button>
                <button class="icon-btn" onclick="sendChat()">
                    <svg class="flower-btn" viewBox="0 0 100 100"><use href="#pointy-flower"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        async function sendChat() {
            const input = document.getElementById('chat-input');
            const log = document.getElementById('chat-log');
            const hero = document.getElementById('hero-logo');
            const msg = input.value.trim();
            
            if(msg !== "") {
                if(hero) hero.style.display = 'none';
                log.innerHTML += `<div class="message msg-user">${msg}</div>`;
                input.value = "";
                log.scrollTop = log.scrollHeight;
                
                const formData = new FormData();
                formData.append("prompt", msg);

                try {
                    const response = await fetch('/chat', { method: 'POST', body: formData });
                    const data = await response.json();
                    let replyText = data.status === 'error' ? (data.message || 'Error occurred.') : data.response;
                    log.innerHTML += `<div class="message msg-ai"><svg style="width:16px;height:16px;margin-right:5px;vertical-align:middle" viewBox="0 0 100 100"><use href="#pointy-flower"/></svg> <b>Kiemaen:</b><br>${replyText}</div>`;
                } catch (err) {
                    log.innerHTML += `<div class="message msg-ai" style="color:#ef4444;">Connection Error.</div>`;
                }
                log.scrollTop = log.scrollHeight;
            }
        }
    </script>
</body>
</html>
