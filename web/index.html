<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiemaen AGI HUD</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <style>
        body { background-color: #121212; color: #00ffcc; font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .message { margin-bottom: 15px; padding: 10px; border-radius: 5px; }
        .user { background-color: #1e1e1e; color: #ffffff; border-left: 4px solid #00ffcc; }
        .bot { background-color: #2a2a2a; color: #00ffcc; border-left: 4px solid #ff00ff; }
        .error { background-color: #3a1010; color: #ff4444; border-left: 4px solid #ff0000; }
        #input-container { display: flex; padding: 10px; background-color: #1e1e1e; }
        input[type="text"] { flex-grow: 1; padding: 10px; background-color: #2a2a2a; color: white; border: 1px solid #00ffcc; outline: none; }
        button { padding: 10px 15px; margin-left: 5px; background-color: #00ffcc; color: black; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #00ccaa; }
        .mic-active { background-color: #ff00ff !important; color: white !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .code-header { background: #333; padding: 5px; display: flex; justify-content: flex-end; gap: 5px; font-size: 12px; }
        .code-header button { padding: 3px 8px; font-size: 10px; background: #555; color: white; }
        pre { margin: 0; }
    
        /* Monetization Top Bar */
        #top-bar { background-color: #1e1e1e; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ffcc; }
        .brand { font-size: 1.2rem; font-weight: bold; color: #00ffcc; text-shadow: 0 0 5px #00ffcc; }
        .donate-btn { background: linear-gradient(90deg, #ff00ff, #00ffcc); color: black; padding: 8px 15px; text-decoration: none; font-weight: bold; border-radius: 5px; transition: 0.3s; }
        .donate-btn:hover { box-shadow: 0 0 10px #00ffcc; opacity: 0.9; }

    </style>
</head>

<body>
    <div id="top-bar">
        <div class="brand">KIEMAEN AGI - Global Hivemind</div>
        <!-- Replace this link with your actual PayPal / Ko-Fi / Patreon link -->
        <a href="https://ko-fi.com/YOUR_LINK_HERE" target="_blank" class="donate-btn">☕ Support / Donate</a>
    </div>

    <div id="chat-container"></div>
    <div id="input-container">
        <input type="file" id="imageInput" accept="image/*" style="display:none">
        <button onclick="document.getElementById('imageInput').click()">📷</button>
        <input type="text" id="userInput" placeholder="Command Kiemaen..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="micBtn" onclick="toggleMic()">🎤</button>
        <button onclick="sendMessage()">SEND</button>
    </div>

    <script>
        let recognition;
        let isListening = false;
        
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onstart = () => { isListening = true; document.getElementById("micBtn").classList.add("mic-active"); };
            recognition.onend = () => { isListening = false; document.getElementById("micBtn").classList.remove("mic-active"); };
            recognition.onresult = (event) => {
                document.getElementById("userInput").value = event.results[0][0].transcript;
                sendMessage();
            };
        }

        function toggleMic() {
            if (!recognition) return alert("Speech recognition not supported in this browser.");
            if (isListening) recognition.stop();
            else recognition.start();
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let cleanText = text.replace(/```[\s\S]*?```/g, "Code block provided in the HUD.");
                let utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.rate = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        function addMessage(text, sender) {
            const chat = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = `message ${sender}`;
            
            if (sender === 'bot') {
                div.innerHTML = marked.parse(text);
                div.querySelectorAll("pre code").forEach((block) => {
                    hljs.highlightElement(block);
                    const pre = block.parentElement;
                    const header = document.createElement("div");
                    header.className = "code-header";
                    
                    const copyBtn = document.createElement("button");
                    copyBtn.innerText = "Copy";
                    copyBtn.onclick = () => navigator.clipboard.writeText(block.innerText);
                    
                    const dlBtn = document.createElement("button");
                    dlBtn.innerText = "Download";
                    dlBtn.onclick = () => {
                        const blob = new Blob([block.innerText], { type: "text/plain" });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url; a.download = `code_${Date.now()}.txt`; a.click();
                    };

                    const playBtn = document.createElement("button");
                    playBtn.innerText = "Play";
                    playBtn.onclick = () => {
                        const win = window.open("", "_blank");
                        win.document.write(block.innerText);
                    };
                    
                    header.append(copyBtn, dlBtn, playBtn);
                    pre.parentNode.insertBefore(header, pre);
                });
            } else {
                div.innerText = text; // user or error
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const imageInput = document.getElementById("imageInput");
            const text = input.value.trim();
            const file = imageInput.files[0];
            
            if (!text && !file) return;

            addMessage(text || "[Image Uploaded]", "user");
            input.value = "";
            
            const formData = new FormData();
            if (text) formData.append("prompt", text);
            if (file) { formData.append("image", file); imageInput.value = ""; }

            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message bot";
            loadingDiv.id = "loading";
            loadingDiv.innerText = "Processing...";
            document.getElementById("chat-container").appendChild(loadingDiv);

            try {
                let response = await fetch("/chat", { method: "POST", body: formData });
                document.getElementById("loading").remove();

                if (!response.ok) {
                    let errText = await response.text();
                    throw new Error(`Server returned ${response.status}: ${errText}`);
                }

                let result = await response.json();
                if (result.status === "error") throw new Error(result.message);

                addMessage(result.response, "bot");
                speak(result.response);
            } catch (error) {
                document.getElementById("loading")?.remove();
                addMessage(`⚠️ SYSTEM ERROR:\n${error.message}`, "error");
                speak("I encountered an API error. Please read the log output on the screen.");
                console.error("Communication Error:", error);
            }
        }
    </script>
</body>
</html>
