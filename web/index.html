<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiemaen AGI</title>
    <style>
        :root {
            --bg-dark: #070a14;
            --bg-panel: #111827;
            --input-bg: #161f33;
            --text-secondary: #9ca3af;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-dark); color: #ffffff; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .blue-black-text { background: linear-gradient(135deg, #60a5fa 0%, #1e3a8a 40%, #000000 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0px 2px 12px rgba(59, 130, 246, 0.2)); }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background-color: var(--bg-dark); border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10; }
        .menu-icon { font-size: 24px; cursor: pointer; color: #fff; user-select: none; }
        .header-title { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
        .login-btn { background-color: rgba(255,255,255,0.1); color: #fff; border: none; padding: 6px 18px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.05); }
        .login-btn:hover { background-color: rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.5); }
        
        .main-container { flex-grow: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .hero-center { position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .hero-center h1 { font-size: 34px; font-weight: 800; margin-top: 15px; letter-spacing: -0.5px; }
        
        .chat-scroll { flex-grow: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }
        .message { margin-bottom: 20px; max-width: 85%; line-height: 1.5; font-size: 15px; }
        .msg-user { margin-left: auto; background-color: var(--input-bg); padding: 12px 18px; border-radius: 18px 18px 0 18px; color: #fff; border: 1px solid rgba(255,255,255,0.05); }
        .msg-ai { margin-right: auto; padding: 12px 0; color: #e5e7eb; }

        .input-wrapper { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px 20px; box-sizing: border-box; background: linear-gradient(transparent, var(--bg-dark) 30%); }
        .input-bar { display: flex; align-items: center; background-color: var(--input-bg); border-radius: 35px; padding: 10px 18px; gap: 12px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        .icon-btn { background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
        .input-field { flex-grow: 1; background: transparent; border: none; color: #fff; font-size: 16px; outline: none; padding: 4px 0; }
        .input-field::placeholder { color: var(--text-secondary); }

        .flower-logo { width: 90px; height: 90px; filter: drop-shadow(0 0 15px rgba(29, 78, 216, 0.6)); }
        .flower-btn { width: 30px; height: 30px; filter: drop-shadow(0 0 8px rgba(29, 78, 216, 0.8)); cursor: pointer; }

        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 300; opacity: 0; transition: opacity 0.3s ease; }
        .auth-overlay.show { display: flex; opacity: 1; }
        .auth-card { background: var(--bg-panel); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 16px; padding: 35px 25px; width: 90%; max-width: 380px; box-shadow: 0 15px 50px rgba(0,0,0,0.8); position: relative; transform: translateY(20px); transition: transform 0.3s ease; }
        .auth-overlay.show .auth-card { transform: translateY(0); }
        
        .auth-close { position: absolute; top: 15px; right: 20px; color: var(--text-secondary); font-size: 28px; cursor: pointer; transition: 0.2s; }
        .auth-close:hover { color: #fff; }
        .auth-title { font-size: 26px; font-weight: 800; margin-bottom: 25px; text-align: center; }
        
        .auth-input { width: 100%; box-sizing: border-box; background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.08); color: #fff; padding: 14px 16px; border-radius: 12px; margin-bottom: 15px; font-size: 15px; outline: none; transition: 0.2s; }
        .auth-input:focus { border-color: #3b82f6; box-shadow: 0 0 12px rgba(59, 130, 246, 0.2); }
        
        .auth-btn { width: 100%; background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 20px; margin-top: 5px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .auth-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
        
        .auth-switch { text-align: center; font-size: 14px; color: var(--text-secondary); cursor: pointer; transition: 0.2s; }
        .auth-switch span { color: #60a5fa; font-weight: 600; }
        .auth-switch:hover span { color: #3b82f6; text-decoration: underline; }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <radialGradient id="blueBlackGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#000000"/>
                <stop offset="40%" stop-color="#1e3a8a"/>
                <stop offset="100%" stop-color="#3b82f6"/>
            </radialGradient>
            <g id="pointy-flower">
                <path d="M50 50 Q 35 25, 50 0 Q 65 25, 50 50" fill="url(#blueBlackGlow)" transform="rotate(0 50 50)"/>
                <path d="M50 50 Q 35 25, 50 0 Q 65 25, 50 50" fill="url(#blueBlackGlow)" transform="rotate(72 50 50)"/>
                <path d="M50 50 Q 35 25, 50 0 Q 65 25, 50 50" fill="url(#blueBlackGlow)" transform="rotate(144 50 50)"/>
                <path d="M50 50 Q 35 25, 50 0 Q 65 25, 50 50" fill="url(#blueBlackGlow)" transform="rotate(216 50 50)"/>
                <path d="M50 50 Q 35 25, 50 0 Q 65 25, 50 50" fill="url(#blueBlackGlow)" transform="rotate(288 50 50)"/>
                <circle cx="50" cy="50" r="4" fill="#000000"/>
            </g>
        </defs>
    </svg>

    <div class="top-bar">
        <div class="menu-icon">≡</div>
        <div class="header-title blue-black-text">Kiemaen AGI</div>
        <button class="login-btn" id="top-login-btn" onclick="openAuth()">Login</button>
    </div>

    <div class="main-container">
        <div class="hero-center" id="hero-logo">
            <svg class="flower-logo" viewBox="0 0 100 100"><use href="#pointy-flower"/></svg>
            <h1 class="blue-black-text">Kiemaen AI</h1>
        </div>
        <div class="chat-scroll" id="chat-log"></div>
        <div class="input-wrapper">
            <div class="input-bar">
                <button class="icon-btn">📎</button>
                <input type="text" class="input-field" id="chat-input" placeholder="Message Kiemaen..." onkeypress="if(event.key === 'Enter') sendChat()">
                <button class="icon-btn">🎤</button>
                <button class="icon-btn" onclick="sendChat()">
                    <svg class="flower-btn" viewBox="0 0 100 100"><use href="#pointy-flower"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="auth-overlay" id="auth-modal">
        <div class="auth-card">
            <div class="auth-close" onclick="closeAuth()">×</div>
            <div class="auth-title blue-black-text" id="auth-title">CEO Login</div>
            
            <form id="auth-form" onsubmit="submitAuth(event)">
                <input type="email" id="auth-email" class="auth-input" placeholder="Executive Email Address" required>
                <input type="password" id="auth-pass" class="auth-input" placeholder="Password" required>
                <input type="password" id="auth-pass-confirm" class="auth-input" placeholder="Confirm Password" style="display:none;">
                <button type="submit" class="auth-btn" id="auth-submit-btn">Authenticate</button>
            </form>
            
            <div class="auth-switch" id="auth-switch" onclick="toggleAuthMode()">
                New executive? <span>Register here</span>
            </div>
        </div>
    </div>

    <script>
        async function sendChat() {
            const input = document.getElementById('chat-input');
            const log = document.getElementById('chat-log');
            const hero = document.getElementById('hero-logo');
            const msg = input.value.trim();
            
            if(msg !== "") {
                if(hero) hero.style.display = 'none';
                log.innerHTML += `<div class="message msg-user">${msg}</div>`;
                input.value = "";
                log.scrollTop = log.scrollHeight;
                
                const formData = new FormData();
                formData.append("prompt", msg);

                try {
                    const response = await fetch('/chat', { method: 'POST', body: formData });
                    const data = await response.json();
                    let replyText = data.status === 'error' ? (data.message || 'Error occurred.') : data.response;
                    log.innerHTML += `<div class="message msg-ai"><svg style="width:16px;height:16px;margin-right:5px;vertical-align:middle" viewBox="0 0 100 100"><use href="#pointy-flower"/></svg> <b>Kiemaen:</b><br>${replyText}</div>`;
                } catch (err) {
                    log.innerHTML += `<div class="message msg-ai" style="color:#ef4444;">Connection Error.</div>`;
                }
                log.scrollTop = log.scrollHeight;
            }
        }

        let isLoginMode = true;

        function openAuth() {
            document.getElementById('auth-modal').classList.add('show');
        }

        function closeAuth() {
            document.getElementById('auth-modal').classList.remove('show');
            document.getElementById('auth-form').reset();
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-form').reset();
            
            const title = document.getElementById('auth-title');
            const submitBtn = document.getElementById('auth-submit-btn');
            const passConfirm = document.getElementById('auth-pass-confirm');
            const switchText = document.getElementById('auth-switch');

            if (isLoginMode) {
                title.innerText = "CEO Login";
                submitBtn.innerText = "Authenticate";
                passConfirm.style.display = "none";
                passConfirm.required = false;
                switchText.innerHTML = "New executive? <span>Register here</span>";
            } else {
                title.innerText = "Executive Registration";
                submitBtn.innerText = "Create Account";
                passConfirm.style.display = "block";
                passConfirm.required = true;
                switchText.innerHTML = "Already registered? <span>Login here</span>";
            }
        }

        async function submitAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            
            if (!isLoginMode) {
                const passConfirm = document.getElementById('auth-pass-confirm').value;
                if (pass !== passConfirm) {
                    alert("Passwords do not match.");
                    return;
                }
            }
            
            // UI Overlay success simulation for now
            const topBtn = document.getElementById('top-login-btn');
            topBtn.innerText = "CEO Active";
            topBtn.style.color = "#60a5fa";
            topBtn.style.borderColor = "#3b82f6";
            
            alert(isLoginMode ? "Authentication Successful. CEO Mode Unlocked." : "Registration Successful. Please Login.");
            
            if(!isLoginMode) {
                toggleAuthMode();
            } else {
                closeAuth();
            }
        }
    </script>
</body>
</html>
